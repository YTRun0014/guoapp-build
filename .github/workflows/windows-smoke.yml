name: Build and smoke test Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
      - name: Add MinGW-w64 to PATH
        run: echo "C:\\msys64\\mingw64\\bin" >> $env:GITHUB_PATH
      - name: Build Windows package
        run: python scripts/build_windows.py --all-sources
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Package smoke test
        run: python scripts/smoke_windows.py --all-sources
      - uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-windows
          path: |
            dist/windows/*
            build/windows-package-smoke.json
          if-no-files-found: error
          retention-days: 14
