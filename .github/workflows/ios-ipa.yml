name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      variant:
        description: '构建版本'
        type: choice
        options: [zhenguojian, hongguojian]
        default: zhenguojian

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Build unsigned IPA
        run: python3 scripts/build_ios.py ${{ inputs.variant == 'zhenguojian' && '--all-sources' || '' }}
      - name: Show artifacts
        run: |
          ls -l dist/ios
          cat dist/ios/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.variant }}-ios-unsigned
          path: dist/ios/*
          if-no-files-found: error
          retention-days: 14
